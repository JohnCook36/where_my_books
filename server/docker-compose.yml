services:
  postgres:
    image: postgres:16-alpine
    container_name: booknook-postgres
    environment:
      POSTGRES_DB: booknook
      POSTGRES_USER: booknook
      POSTGRES_PASSWORD: booknook
    ports:
      - "5432:5432"
    volumes:
      - booknook-postgres-data:/var/lib/postgresql/data

volumes:
  booknook-postgres-data:
