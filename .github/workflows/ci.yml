name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: booknook
          POSTGRES_PASSWORD: integration-only
          POSTGRES_DB: booknook_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U booknook -d booknook_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://booknook:integration-only@localhost:5432/booknook_test?schema=public
      WMB_INTEGRATION_TEST: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate --workspace @where-my-books/server

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Apply additive migrations to PostgreSQL
        run: npm run prisma:deploy --workspace @where-my-books/server

      - name: PostgreSQL HTTP integration and persistence
        run: npm run test:integration --workspace @where-my-books/server
